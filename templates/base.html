<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center"
           href="https://tbcbank.ge/ka/tbc-education"
           target="_blank">
            <img src="{{ url_for('static', filename='tbctbc.png') }}" style="height:40px;margin-right:10px;">
            CareerTest
        </a>

        <div class="ms-auto">
            {% if session.get("user") %}
                <span class="text-white me-3">👤 {{ session["user"] }}</span>
                <a href="/test" class="btn btn-outline-light btn-sm">ტესტი</a>
                <a href="/logout" class="btn btn-danger btn-sm ms-2">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
